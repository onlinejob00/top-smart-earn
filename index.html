<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Smart Earn - Free</title>
<style>
body{font-family:sans-serif;background:#f1f5f9;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;padding:25px;border-radius:15px;width:95%;max-width:380px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
.hidden{display:none}
</style>
</head>
<body>

<div class="card" id="authBox">
  <h2 id="formTitle" style="text-align:center">নিবন্ধন করুন</h2>
  <input type="text" id="regNum" placeholder="মোবাইল নম্বর">
  <input type="password" id="regPass" placeholder="পাসওয়ার্ড">
  <button onclick="handleAuth()">নিবন্ধন / লগইন</button>
  <p style="text-align:center;font-size:13px;margin-top:10px">একবার নিবন্ধন করলে পরের বার একই নম্বর পাসওয়ার্ড দিয়ে লগইন হবে</p>
</div>

<div class="card hidden" id="dashBox">
  <h2>ড্যাশবোর্ডে স্বাগতম ✅</h2>
  <p>নম্বর: <b id="dNum"></b></p>
  <p>এখন থেকে আপনি সব কাজ করতে পারবেন।</p>
  <button onclick="logout()" style="background:#ef4444">লগআউট</button>
</div>

<script>
function handleAuth(){
  let num = document.getElementById('regNum').value.trim();
  let pass = document.getElementById('regPass').value.trim();
  if(!num ||!pass){ alert("নম্বর ও পাসওয়ার্ড দিন"); return; }

  let users = JSON.parse(localStorage.getItem('tse_users') || '{}');

  // যদি ইউজার আগে থাকে - লগইন চেক
  if(users[num]){
    if(users[num].pass === pass){
      loginSuccess(num);
    } else {
      alert("পাসওয়ার্ড ভুল!");
    }
  } else {
    // নতুন ইউজার - সাথে সাথে নিবন্ধন + ড্যাশবোর্ড
    users[num] = { pass: pass, createdAt: new Date().toLocaleString() };
    localStorage.setItem('tse_users', JSON.stringify(users));
    loginSuccess(num);
  }
}

function loginSuccess(num){
  localStorage.setItem('tse_current', num);
  document.getElementById('authBox').classList.add('hidden');
  document.getElementById('dashBox').classList.remove('hidden');
  document.getElementById('dNum').innerText = num;
}

function logout(){
  localStorage.removeItem('tse_current');
  document.getElementById('dashBox').classList.add('hidden');
  document.getElementById('authBox').classList.remove('hidden');
}

// অটো লগইন চেক - রিলোড দিলেও ড্যাশবোর্ডে থাকবে
window.onload = function(){
  let cur = localStorage.getItem('tse_current');
  if(cur){
    loginSuccess(cur);
  }
}
</script>
</body>
                              </html>
