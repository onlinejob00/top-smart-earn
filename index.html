<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>top-smart-earn</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0}
.box{max-width:380px;margin:auto;padding:15px}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:16px;margin-top:12px}
input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #333;margin-top:10px;box-sizing:border-box}
button{background:#00ff88;color:#000;font-weight:900;border:none}
.out{background:#222;color:#fff}
h2{text-align:center;color:#00ff88}
</style>
</head>
<body>
<div class="box">
<h2>top-smart-earn</h2>
<p style="text-align:center;color:#888;font-size:12px">Admin: Shourov</p>

<div class="card" id="authBox">
<h3>নিবন্ধন করুন</h3>
<input id="ph" placeholder="মোবাইল নাম্বার (11 ডিজিট)">
<input id="ps" type="password" placeholder="পাসওয়ার্ড">
<button onclick="register()">নিবন্ধন ও ড্যাশবোর্ডে যান</button>
<p style="font-size:11px;color:#666;text-align:center;margin-top:8px">একাউন্ট থাকলে একই নাম্বার পাসওয়ার্ড দিয়ে লগইন হবে</p>
</div>

<div class="card" id="dashBox" style="display:none">
<h3 id="uname"></h3>
<p>ব্যালেন্স: ৳<span id="bal">0</span></p>
<button onclick="addBal(0.2)">Typing Task +0.20</button>
<button onclick="addBal(10)">Gmail Task +10</button>
<button onclick="addBal(3)">Facebook Task +3</button>
<button onclick="addBal(0.5)">Math Task +0.5</button>
<button class="out" onclick="logout()">Logout</button>
</div>

<div class="card" id="adminBox" style="display:none">
<h3 style="color:#ff4757">ADMIN Panel</h3>
<div id="userList"></div>
<button class="out" onclick="logout()">Logout</button>
</div>

</div>

<script>
function getUsers(){return JSON.parse(localStorage.getItem('tse_users')||'[]')}
function saveUsers(u){localStorage.setItem('tse_users',JSON.stringify(u))}

function register(){
 let ph=document.getElementById('ph').value.trim();
 let ps=document.getElementById('ps').value.trim();
 if(ph.length<11) return alert('সঠিক নাম্বার দিন');
 if(ps.length<3) return alert('পাসওয়ার্ড দিন');

 // Admin login
 if(ph=='01734770374' && ps=='admin123'){
   document.getElementById('authBox').style.display='none';
   document.getElementById('adminBox').style.display='block';
   showAdmin();
   return;
 }

 let users=getUsers();
 let found=users.find(x=>x.phone==ph);

 if(!found){
   // নতুন ইউজার
   let newUser={phone:ph,pass:ps,bal:0};
   users.push(newUser);
   saveUsers(users);
   localStorage.setItem('tse_cur', JSON.stringify(newUser));
   openDash(newUser);
 } else {
   if(found.pass!=ps) return alert('পাসওয়ার্ড ভুল');
   localStorage.setItem('tse_cur', JSON.stringify(found));
   openDash(found);
 }
}

function openDash(u){
 document.getElementById('authBox').style.display='none';
 document.getElementById('dashBox').style.display='block';
 document.getElementById('uname').innerText=u.phone;
 document.getElementById('bal').innerText=u.bal;
}

function addBal(a){
 let cur=JSON.parse(localStorage.getItem('tse_cur'));
 cur.bal+=a;
 document.getElementById('bal').innerText=cur.bal.toFixed(2);
 // save
 let users=getUsers();
 let idx=users.findIndex(x=>x.phone==cur.phone);
 users[idx].bal=cur.bal;
 saveUsers(users);
 localStorage.setItem('tse_cur',JSON.stringify(cur));
}
